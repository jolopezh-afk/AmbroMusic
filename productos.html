<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - Sonido Vivo</title>
    <!-- Asegúrate de coordinar el nombre de este archivo con tu equipo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<body class="d-flex flex-column min-vh-100">

    <header>
        <nav>
            <!-- Menú de navegación unificado con tus compañeros -->

        </nav>
        <div id="carrito-resumen">
            🛒 Carrito: <span id="contador-carrito">0</span> ítems
        </div>
    </header>

    <main class="flex-grow-1">
        <section>
            <h2>Catálogo de Instrumentos y Equipos</h2>
            <!-- Este contenedor vacío será llenado por tu JavaScript -->

        </section>
    </main>

    <footer>
        <p>AmbroMusic - La Florida, Santiago de Chile. Todos los derechos reservados.</p>
    </footer>

    <!-- Tu script exclusivo para la lógica del catálogo -->
    <script src="js/catalogo.js"></script>
    <script src="js/componentes/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
