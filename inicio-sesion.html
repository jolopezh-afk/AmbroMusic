<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmbroMusic</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="d-flex flex-column min-vh-100">


    <custom-indice></custom-indice>

    <main class="container flex-grow-1 d-flex justify-content-center align-items-center login-container">

        <div class="card login-card shadow">

            <div class="card-body p-4">

                <h2 class="text-center mb-4 login-titulo">
                    Iniciar Sesión
                </h2>

                <div class="mb-3">
                    <label for="input-email" class="form-label">
                        Correo electrónico
                    </label>
                    <input id="input-email" type="email" class="form-control" placeholder="Ingrese correo">
                </div>

                <div class="mb-4">
                    <label for="input-password" class="form-label">
                        Contraseña
                    </label>
                    <input id="input-password" type="password" class="form-control" placeholder="Ingrese contraseña">
                </div>

                <button id="btn-inicio-sesion" class="btn btn-ambromusic w-100">
                    Iniciar Sesión
                </button>

            </div>
        </div>



    </main>

    <footer>
        <p>AmbroMusic - La Florida, Santiago de Chile. Todos los derechos reservados.</p>
    </footer>

    <script src="js/componentes/navbar.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYJwRcwXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="js/inicio-sesion.js"></script>

</body>

</html>
